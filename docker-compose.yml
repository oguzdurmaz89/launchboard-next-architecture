services:
  postgres:
    image: postgres:16-alpine
    container_name: launchboard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: launchboard
      POSTGRES_PASSWORD: launchboard
      POSTGRES_DB: launchboard
    volumes:
      - launchboard-postgres-data:/var/lib/postgresql/data

volumes:
  launchboard-postgres-data: